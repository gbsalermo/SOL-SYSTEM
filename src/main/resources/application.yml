spring:
  application:
    name: sol-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
  flyway:
    enabled: false

server:
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  zone-id: America/Bahia
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-change-this-secret-before-production-123456789}
      expiration-minutes: 480
  telegram:
    enabled: ${TELEGRAM_ENABLED:false}
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
    daily-report-cron: "0 0 19 * * *"
