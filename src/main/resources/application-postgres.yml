spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sol_system}
    username: ${DB_USERNAME:sol_system}
    password: ${DB_PASSWORD:sol_system_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true

logging:
  level:
    org.hibernate.SQL: info
